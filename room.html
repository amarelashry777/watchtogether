<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة المشاهدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: system-ui, sans-serif; }
        .emoji-float { position: absolute; bottom: 10%; font-size: 2.5rem; animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 50; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-300px) scale(1.5); opacity: 0; } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center min-h-screen">
    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-4">
            <!-- شريط دعوة الأصدقاء -->
            <div class="bg-indigo-600/20 border border-indigo-500/50 p-4 rounded-2xl flex justify-between items-center">
                <span class="text-indigo-300 font-bold text-sm">شارك هذا الرابط مع أصدقائك لدخول الغرفة:</span>
                <button onclick="copyInviteLink()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-bold transition">
                    <i class="fa-solid fa-copy ml-2"></i>نسخ الرابط
                </button>
            </div>

            <div class="bg-slate-800 p-4 rounded-2xl shadow-xl flex gap-2">
                <input type="text" id="link-input" placeholder="رابط يوتيوب أو فيديو مباشر..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                <button onclick="broadcastMedia()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-bold transition">بث</button>
            </div>

            <div id="player-container" class="aspect-video bg-black rounded-2xl overflow-hidden relative flex items-center justify-center border border-slate-700 shadow-2xl">
                <div class="text-center text-slate-500"><i class="fa-solid fa-play text-5xl mb-3"></i><p>في انتظار البث...</p></div>
            </div>

            <div class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl">
                <span class="text-sm font-bold text-slate-400">تفاعل:</span>
                <div class="flex gap-4 text-2xl cursor-pointer">
                    <span onclick="triggerEmoji('🔥')">🔥</span>
                    <span onclick="triggerEmoji('❤️')">❤️</span>
                    <span onclick="triggerEmoji('😂')">😂</span>
                </div>
            </div>
        </div>

        <!-- الشات -->
        <div class="bg-slate-800 p-4 rounded-2xl shadow-xl flex flex-col h-[550px]">
            <h3 class="font-bold border-b border-slate-700 pb-3 mb-3 text-indigo-400">شات الغرفة</h3>
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-3 pr-2 text-sm"></div>
            <div class="mt-3 flex gap-2 border-t border-slate-700 pt-3">
                <input type="text" id="chat-input" placeholder="رسالتك..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none" onkeypress="if(event.key === 'Enter') sendMsg()">
                <button onclick="sendMsg()" class="bg-indigo-600 px-5 py-3 rounded-xl hover:bg-indigo-500"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); 
        // استخراج رقم الغرفة من اللينك
        const roomId = window.location.pathname.substring(1);
        socket.emit('joinRoom', roomId);

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('تم نسخ الرابط! ابعته لأصحابك دلوقتي.');
        }

        function broadcastMedia() {
            const url = document.getElementById('link-input').value.trim();
            if(url) {
                socket.emit('playMedia', { roomId, url });
                document.getElementById('link-input').value = '';
            }
        }

        function sendMsg() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(msg) {
                socket.emit('sendMessage', { roomId, msg });
                input.value = '';
            }
        }

        function triggerEmoji(emoji) {
            socket.emit('sendEmoji', { roomId, emoji });
        }

        socket.on('syncMedia', (url) => {
            const container = document.getElementById('player-container');
            if(url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = url.includes('youtu.be/') ? url.split('youtu.be/')[1].split('?')[0] : new URLSearchParams(new URL(url).search).get('v');
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>`;
            } else if(url.endsWith('.mp3')) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center w-full h-full bg-slate-900"><i class="fa-solid fa-music text-6xl text-pink-500 mb-4"></i><audio src="${url}" controls autoplay class="w-3/4"></audio></div>`;
            } else {
                container.innerHTML = `<video src="${url}" controls autoplay class="w-full h-full object-contain"></video>`;
            }
        });

        socket.on('receiveMessage', (msg) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="bg-slate-700 p-3 rounded-xl break-words border border-slate-600"><span class="text-indigo-400 font-bold text-xs block mb-1">رسالة:</span>${msg}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('receiveEmoji', (emoji) => {
            const container = document.getElementById('player-container');
            const el = document.createElement('div');
            el.className = 'emoji-float';
            el.innerText = emoji;
            el.style.left = Math.floor(Math.random() * 80 + 10) + '%';
            container.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        });
    </script>
</body>
</html>
