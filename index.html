<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchTogether - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #0f172a; color: white; }</style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-10 rounded-3xl shadow-2xl text-center max-w-md w-full border border-slate-700">
        <i class="fa-solid fa-clapperboard text-6xl text-indigo-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-2">WatchTogether</h1>
        <p class="text-slate-400 mb-8">شاهد فيديوهات يوتيوب وتحدث مع أصدقائك في نفس اللحظة بدون تأخير.</p>
        
        <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold text-lg transition shadow-lg shadow-indigo-500/30 flex justify-center items-center gap-2">
            <i class="fa-solid fa-plus"></i> إنشاء غرفة جديدة
        </button>
    </div>

    <script>
        function createRoom() {
            // توليد كود عشوائي للغرفة (مثال: a7b9x)
            const roomId = Math.random().toString(36).substring(2, 8);
            // تحويل المستخدم للينك الغرفة الجديد
            window.location.href = '/' + roomId;
        }
    </script>
</body>
</html>
